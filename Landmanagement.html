<title>L-TIME PROPERTIES | 5-in-1 Estate Management System</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#e5e9f0;--brand:#123c6b;--green:#2e8b57;--yellow:#f2c94c;--red:#d64545;--gray:#8b95a7;}
*{box-sizing:border-box} body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.app{display:flex;min-height:100vh} aside{width:260px;background:#102f50;color:white;padding:22px 14px;position:fixed;inset:0 auto 0 0;overflow:auto}
.brand{font-size:20px;font-weight:800;padding:0 10px 24px} .brand small{display:block;font-size:11px;opacity:.7;margin-top:5px}
.nav-title{font-size:11px;text-transform:uppercase;opacity:.55;padding:18px 10px 7px} nav button{width:100%;border:0;background:transparent;color:white;text-align:left;padding:11px 12px;border-radius:8px;cursor:pointer;font-size:14px;margin:2px 0} nav button:hover,nav button.active{background:#1d4f80}
main{margin-left:260px;width:calc(100% - 260px);padding:24px} .top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}
h1{font-size:25px;margin:0} h2{margin:0 0 15px;font-size:19px} .muted{color:var(--muted);font-size:13px}
.page{display:none} .page.active{display:block} .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:17px;box-shadow:0 2px 8px #0b1b2b0a} .metric{font-size:28px;font-weight:800;margin-top:8px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0} input,select,textarea{border:1px solid #d5dbe5;border-radius:7px;padding:9px 10px;background:white;font:inherit} button.primary,.primary{background:var(--brand);color:white;border:0;padding:9px 13px;border-radius:7px;cursor:pointer} button.danger{background:#fff0f0;color:#a52828;border:1px solid #f1caca;padding:8px 11px;border-radius:7px;cursor:pointer}
table{width:100%;border-collapse:collapse;background:white} th,td{padding:10px 9px;border-bottom:1px solid var(--line);text-align:left;font-size:13px} th{background:#f7f9fc;position:sticky;top:0;z-index:1} .table-wrap{overflow:auto;max-height:62vh;border:1px solid var(--line);border-radius:10px}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700} .available{background:#e5f6ec;color:#217246} .reserved{background:#fff4cc;color:#7a5a00} .sold{background:#ffe2e2;color:#a52020} .notavailable{background:#eceff3;color:#555f70}
#map{height:72vh;border-radius:12px;overflow:hidden;border:1px solid var(--line)} .legend{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0} .dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.modal{position:fixed;inset:0;background:#07111c88;display:none;align-items:center;justify-content:center;padding:20px;z-index:5000} .modal.show{display:flex} .modalbox{background:white;width:min(720px,100%);max-height:90vh;overflow:auto;border-radius:13px;padding:20px} .formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px} label{font-size:12px;font-weight:700;color:#475467;display:flex;flex-direction:column;gap:5px} .full{grid-column:1/-1} .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
@media(max-width:900px){aside{width:210px}main{margin-left:210px;width:calc(100% - 210px)}.grid{grid-template-columns:1fr 1fr}}
@media(max-width:650px){aside{position:static;width:100%}.app{display:block}main{margin-left:0;width:100%}.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}}
</style>
<style>
.v3tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}
.v3tabs button{border:1px solid #d5dbe5;background:#fff;padding:8px 11px;border-radius:7px;cursor:pointer}
.v3tabs button.active{background:#123c6b;color:#fff}
.sectionbox{margin-top:15px}
.kpi4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.smallbtn{border:1px solid #d5dbe5;background:#fff;padding:7px 9px;border-radius:6px;cursor:pointer}
.smallbtn:hover{background:#f4f7fb}
.progress{height:8px;background:#edf0f5;border-radius:10px;overflow:hidden}
.progress>i{display:block;height:100%;background:#123c6b}
@media(max-width:800px){.kpi4{grid-template-columns:1fr 1fr}}
</style>

<style>.v4tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.v4tabs button{border:1px solid #d5dbe5;background:#fff;padding:8px 11px;border-radius:7px;cursor:pointer}.v4tabs button.active{background:#123c6b;color:#fff}.v4grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.v4box{margin-top:15px}.progress{height:8px;background:#edf0f5;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;background:#123c6b}@media(max-width:800px){.v4grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.v4grid{grid-template-columns:1fr}}</style></head>
<body>
<div class="app">
<aside>
  <div class="brand">L-TIME PROPERTIES<small>5-IN-1 ESTATE MANAGEMENT SYSTEM</small></div>
  <nav>
    <div class="nav-title">Overview</div>
    <button class="active" data-page="dashboard">📊 Dashboard</button>
    <div class="nav-title">Five Core Systems</div>
    <button data-page="land">🌳 1. Land Management</button>
    <button data-page="sales">💰 2. Sales & Customers</button>
    <button data-page="map">🗺️ 3. Estate GIS Map</button>
    <button data-page="development">🏗️ 4. Development</button>
    <button data-page="finance">📑 5. Finance & Reports</button>
    <div class="nav-title">Administration</div>
    <button data-page="documents">📁 Documents</button>
    <button data-page="audit">🛡️ Audit Log</button>
    <button data-page="settings">⚙️ Settings</button>
  </nav>
</aside>

<main>
<section id="dashboard" class="page active">
 <div class="top"><div><h1>Estate Management Dashboard</h1><div class="muted">Central control for land, sales, GIS, development and finance.</div></div></div>
 <div class="grid" id="metrics"></div>
 <div class="card" style="margin-top:15px"><h2>How the five systems connect</h2>
 <p class="muted">One plot record is the master record. Change a parcel's status or buyer here and the GIS map, sales/customer view and financial summaries update from the same record.</p></div>
</section>

<section id="land" class="page">
 <div class="top"><div><h1>Land Management</h1><div class="muted">Actual surveyed parcel identifiers from A10.json.</div></div><button class="primary" onclick="openPlot()">+ Add / Edit Plot</button></div>
 <div class="toolbar"><input id="landSearch" placeholder="Search plot, buyer, phone..." oninput="renderLand()"><select id="landStatus" onchange="renderLand()"><option value="">All Statuses</option><option>Available</option><option>Reserved</option><option>Sold</option><option>Not Available</option></select></div>
 <div class="table-wrap"><table><thead><tr><th>Plot</th><th>Status</th><th>Area</th><th>Buyer / Owner</th><th>Phone</th><th>Sale Amount (GHS)</th><th>Action</th></tr></thead><tbody id="landBody"></tbody></table></div>
</section>

<section id="sales" class="page">
 <div class="top"><div><h1>Sales & Customers</h1><div class="muted">Customer ownership follows the land register.</div></div></div>
 <div class="grid" id="salesMetrics"></div>
 <div class="card" style="margin-top:15px"><div class="table-wrap"><table><thead><tr><th>Plot</th><th>Customer</th><th>Ghana Card</th><th>Phone</th><th>Sale Amount</th><th>Status</th></tr></thead><tbody id="salesBody"></tbody></table></div></div>
</section>

<section id="map" class="page">
 <div class="top"><div><h1>Estate GIS Map</h1><div class="muted">Surveyed parcel polygons — status is driven by the Land Management register.</div></div></div>
 <div class="legend"><span><i class="dot" style="background:#2e8b57"></i>Available</span><span><i class="dot" style="background:#f2c94c"></i>Reserved</span><span><i class="dot" style="background:#d64545"></i>Sold</span><span><i class="dot" style="background:#8b95a7"></i>Not Available</span></div>
 <div id="map"></div>
</section>

<section id="development" class="page">
 <div class="top"><div><h1>Development Management</h1><div class="muted">Foundation for infrastructure, construction and estate development tracking.</div></div></div>
 <div class="grid"><div class="card"><b>Roads</b><div class="metric">0</div><div class="muted">Projects tracked</div></div><div class="card"><b>Utilities</b><div class="metric">0</div><div class="muted">Projects tracked</div></div><div class="card"><b>Construction</b><div class="metric">0</div><div class="muted">Projects tracked</div></div><div class="card"><b>Completed</b><div class="metric">0</div><div class="muted">Projects completed</div></div></div>
</section>

<section id="finance" class="page">
 <div class="top"><div><h1>Finance & Reports</h1><div class="muted">Financial totals calculated from recorded land sales.</div></div></div>
 <div class="grid" id="financeMetrics"></div>
</section>

<section id="documents" class="page"><div class="card"><h1>Documents</h1><p class="muted">Document management module ready for title deeds, sale agreements, IDs, receipts and development documents.</p><button class="primary" onclick="alert('Document module is the next expansion point.')">Add Document</button></div></section>
<section id="audit" class="page"><div class="card"><h1>Audit Log</h1><p class="muted">Every saved land-management change is recorded locally with timestamp and user.</p><div class="table-wrap"><table><thead><tr><th>Date</th><th>User</th><th>Action</th><th>Plot</th><th>Details</th></tr></thead><tbody id="auditBody"></tbody></table></div></div></section>
<section id="settings" class="page"><div class="card"><h1>Settings</h1><p class="muted">Prototype storage uses this browser's localStorage. Production deployment should use a central database/API for multi-user synchronization.</p></div></section>
</main>
</div>

<div class="modal" id="plotModal">
 <div class="modalbox"><h2 id="modalTitle">Plot Information</h2>
 <form id="plotForm">
  <div class="formgrid">
   <label>Plot No.<select id="plotNo" required></select></label>
   <label>Status<select id="plotStatus"><option>Available</option><option>Reserved</option><option>Sold</option><option>Not Available</option></select></label>
   <label>Buyer / Owner<input id="buyer"></label>
   <label>Ghana Card No.<input id="ghanaCard"></label>
   <label>Phone<input id="phone"></label>
   <label>Email<input id="email"></label>
   <label>Sale Amount (GHS)<input id="amount" type="number" min="0" step="0.01"></label>
   <label>Street / Address<input id="address"></label>
   <label class="full">Notes<textarea id="notes" rows="3"></textarea></label>
  </div>
  <div class="actions"><button type="button" onclick="closePlot()">Cancel</button><button class="primary" type="submit">Save Changes</button></div>
 </form>
 </div>
</div>

const KEY = 'ltime_5in1_records_v2';
const AUDIT = 'ltime_5in1_audit_v1';
let records = JSON.parse(localStorage.getItem(KEY) || '{}');
let map = null, layer = null;

function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function save(){localStorage.setItem(KEY,JSON.stringify(records));}
function audit(action,plot,details){let a=JSON.parse(localStorage.getItem(AUDIT)||'[]');a.unshift({date:new Date().toLocaleString(),user:'Admin',action,plot,details});localStorage.setItem(AUDIT,JSON.stringify(a.slice(0,500)));}
function statusClass(s){return (s||'Available').toLowerCase().replace(/\s+/g,'')}
function rec(id){return records[id] || {plot_no:id,status:'Available',buyer:'',ghanaCard:'',phone:'',email:'',amount:'',address:'',notes:''}}

function nav(page){
 document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
 document.getElementById(page).classList.add('active');
 document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===page));
 if(page==='map'){setTimeout(initMap,80);}
 if(page==='land')renderLand(); if(page==='sales')renderSales(); if(page==='dashboard')renderDashboard(); if(page==='finance')renderFinance(); if(page==='audit')renderAudit();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>nav(b.dataset.page));

function renderDashboard(){
 let all=PARCELS.map(p=>rec(p.plot_no)), sold=all.filter(x=>x.status==='Sold').length, reserved=all.filter(x=>x.status==='Reserved').length;
 let available=all.filter(x=>x.status==='Available').length, na=all.filter(x=>x.status==='Not Available').length;
 let revenue=all.reduce((n,x)=>n+(Number(x.amount)||0),0);
 document.getElementById('metrics').innerHTML=[
 ['Total Parcels',all.length,'Surveyed parcels'],['Available',available,'Ready for sale'],['Reserved',reserved,'Reserved parcels'],['Sold',sold,'Completed sales'],['Not Available',na,'Unavailable'],['Recorded Sales',revenue.toLocaleString(),'GHS'],['Customers',all.filter(x=>x.buyer).length,'Buyer/owner records'],['GIS Linked',all.length,'Parcel polygons']
 ].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="metric">${x[1]}</div><div class="muted">${x[2]}</div></div>`).join('');
}
function renderLand(){
 let q=(document.getElementById('landSearch')?.value||'').toLowerCase(), st=document.getElementById('landStatus')?.value||'';
 let rows=PARCELS.map(p=>({...p,...rec(p.plot_no)})).filter(x=>(!q||[x.plot_no,x.buyer,x.phone,x.address].join(' ').toLowerCase().includes(q))&&(!st||x.status===st));
 document.getElementById('landBody').innerHTML=rows.map(x=>`<tr><td><b>${esc(x.plot_no)}</b></td><td><span class="badge ${statusClass(x.status)}">${esc(x.status)}</span></td><td>${x.area_acres!==''?Number(x.area_acres).toFixed(4):'-'}</td><td>${esc(x.buyer)||'-'}</td><td>${esc(x.phone)||'-'}</td><td>${Number(x.amount||0).toLocaleString()}</td><td><button class="primary" onclick="openPlot('${encodeURIComponent(x.plot_no)}')">Edit</button></td></tr>`).join('');
}
function renderSales(){
 let all=PARCELS.map(p=>rec(p.plot_no)), sold=all.filter(x=>x.status==='Sold'), revenue=sold.reduce((n,x)=>n+(Number(x.amount)||0),0);
 document.getElementById('salesMetrics').innerHTML=[['Sold Plots',sold.length],['Customers',sold.filter(x=>x.buyer).length],['Sales Value (GHS)',revenue.toLocaleString()],['Average Sale (GHS)',sold.length?(revenue/sold.length).toLocaleString(undefined,{maximumFractionDigits:2}):'0']].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="metric">${x[1]}</div></div>`).join('');
 document.getElementById('salesBody').innerHTML=sold.map(x=>`<tr><td>${esc(x.plot_no)}</td><td>${esc(x.buyer)||'-'}</td><td>${esc(x.ghanaCard)||'-'}</td><td>${esc(x.phone)||'-'}</td><td>${Number(x.amount||0).toLocaleString()}</td><td><span class="badge sold">Sold</span></td></tr>`).join('');
}
function renderFinance(){
 let all=PARCELS.map(p=>rec(p.plot_no)), sold=all.filter(x=>x.status==='Sold'), revenue=sold.reduce((n,x)=>n+(Number(x.amount)||0),0);
 document.getElementById('financeMetrics').innerHTML=[['Gross Recorded Sales','GHS '+revenue.toLocaleString()],['Sold Parcels',sold.length],['Average Sale','GHS '+(sold.length?(revenue/sold.length).toLocaleString(undefined,{maximumFractionDigits:2}):'0')],['Outstanding Framework','Ready for payment schedules']].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="metric">${x[1]}</div></div>`).join('');
}
function renderAudit(){

}
function openPlot(encoded=''){
 let id=encoded?decodeURIComponent(encoded):'';
 let sel=document.getElementById('plotNo');
 sel.innerHTML=PARCELS.map(p=>`<option value="${esc(p.plot_no)}">${esc(p.plot_no)}</option>`).join('');
 if(id)sel.value=id;
 fillForm(sel.value); document.getElementById('plotModal').classList.add('show');
}
function fillForm(id){
 let x=rec(id); document.getElementById('plotNo').value=id; document.getElementById('plotStatus').value=x.status||'Available';
 document.getElementById('buyer').value=x.buyer||'';document.getElementById('ghanaCard').value=x.ghanaCard||'';document.getElementById('phone').value=x.phone||'';
 document.getElementById('email').value=x.email||'';document.getElementById('amount').value=x.amount||'';document.getElementById('address').value=x.address||'';document.getElementById('notes').value=x.notes||'';
}
document.getElementById('plotNo').addEventListener('change',e=>fillForm(e.target.value));
document.getElementById('plotForm').onsubmit=e=>{
 e.preventDefault();let id=document.getElementById('plotNo').value, old=rec(id), x={plot_no:id,status:document.getElementById('plotStatus').value,buyer:document.getElementById('buyer').value.trim(),ghanaCard:document.getElementById('ghanaCard').value.trim(),phone:document.getElementById('phone').value.trim(),email:document.getElementById('email').value.trim(),amount:document.getElementById('amount').value,address:document.getElementById('address').value.trim(),notes:document.getElementById('notes').value.trim()};
 records[id]=x;save();audit('Updated plot',id,`Status: ${old.status} → ${x.status}; Buyer: ${x.buyer||'-'}`);closePlot();renderDashboard();renderLand();renderSales();renderFinance();renderAudit();if(map)refreshMap();};
function closePlot(){document.getElementById('plotModal').classList.remove('show')}

function parcelId(feature){let p=feature.properties||{};return String(p.HN_1??p.H_N??p.TEXTSTRING??'').trim();}
function styleFeature(f){
 let s=rec(parcelId(f)).status||'Available', fill=s==='Sold'?'#d64545':s==='Reserved'?'#f2c94c':s==='Not Available'?'#8b95a7':'#2e8b57';
 return {color:'#ffffff',weight:1,fillColor:fill,fillOpacity:.68};
}
function initMap(){
 if(map){map.invalidateSize();return;}
 map=L.map('map').setView([5.9348,0.1933],15);
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:21,attribution:'© OpenStreetMap contributors'}).addTo(map);
 layer=L.geoJSON(GIS,{style:styleFeature,onEachFeature:(f,l)=>{
   let id=parcelId(f); l.bindPopup(`<b>Plot: ${esc(id)}</b><br>Status: <span class="badge ${statusClass(rec(id).status)}">${esc(rec(id).status)}</span><br>Buyer/Owner: ${esc(rec(id).buyer)||'-'}<br>Area: ${f.properties?.Area_acres!=null?Number(f.properties.Area_acres).toFixed(4):'-'} acres<br><br><button class="primary" onclick="openPlot('${encodeURIComponent(id)}')">Edit Plot</button>`);
 } }).addTo(map);
 try{map.fitBounds(layer.getBounds(),{padding:[15,15]})}catch(e){}
}
function refreshMap(){if(!layer)return;layer.setStyle(styleFeature);layer.eachLayer(l=>{let id=parcelId(l.feature),x=rec(id);l.setPopupContent(`<b>Plot: ${esc(id)}</b><br>Status: <span class="badge ${statusClass(x.status)}">${esc(x.status)}</span><br>Buyer/Owner: ${esc(x.buyer)||'-'}<br>Area: ${l.feature.properties?.Area_acres!=null?Number(l.feature.properties.Area_acres).toFixed(4):'-'} acres<br><br><button class="primary" onclick="openPlot('${encodeURIComponent(id)}')">Edit Plot</button>`);})}
renderDashboard();renderLand();renderSales();renderFinance();renderAudit();
</script>

<script>
const SALES_KEY='ltime_5in1_sales_v3';

let payments=JSON.parse(localStorage.getItem(PAY_KEY)||'[]');

function saveV3(){localStorage.setItem(SALES_KEY,JSON.stringify(sales));localStorage.setItem(PAY_KEY,JSON.stringify(payments));localStorage.setItem(DEV_KEY,JSON.stringify(development));}
function openSale(id=''){let s=document.getElementById('salePlot');s.innerHTML=PARCELS.map(p=>`<option>${esc(p.plot_no)}</option>`).join('');if(id)s.value=decodeURIComponent(id);let r=rec(s.value);document.getElementById('saleCustomer').value=r.buyer||'';document.getElementById('saleCard').value=r.ghanaCard||'';document.getElementById('salePhone').value=r.phone||'';document.getElementById('saleEmail').value=r.email||'';document.getElementById('salePrice').value=r.amount||'';document.getElementById('salePaid').value='';document.getElementById('saleModal').classList.add('show')}
function closeSale(){document.getElementById('saleModal').classList.remove('show')}
document.getElementById('saleForm').onsubmit=e=>{
 e.preventDefault();
 const id=document.getElementById('salePlot').value,type=document.getElementById('saleType').value,customer=document.getElementById('saleCustomer').value.trim(),card=document.getElementById('saleCard').value.trim(),phone=document.getElementById('salePhone').value.trim(),email=document.getElementById('saleEmail').value.trim(),price=Number(document.getElementById('salePrice').value||0),paid=Number(document.getElementById('salePaid').value||0);
 const status=type==='Reservation'?'Reserved':'Sold';
 records[id]={...rec(id),plot_no:id,status,buyer:customer,ghanaCard:card,phone,email,amount:price};
 sales.unshift({id:'TX-'+Date.now(),plot:id,type,customer,card,phone,email,price,paid,balance:Math.max(price-paid,0),date:new Date().toISOString()});
 if(paid>0) payments.unshift({id:'PAY-'+Date.now(),plot:id,customer,amount:paid,date:new Date().toISOString(),type:'Initial Payment'});
 save();saveV3();audit('Created transaction',id,`${type}; Customer: ${customer}; Price: GHS ${price.toLocaleString()}; Paid: GHS ${paid.toLocaleString()}`);closeSale();renderDashboard();renderLand();renderSales();renderFinance();renderAudit();if(map)refreshMap();
};

 document.getElementById('salesKpi').innerHTML=[['Transactions',sales.length],['Contract Value','GHS '+total.toLocaleString()],['Collected','GHS '+paid.toLocaleString()],['Outstanding','GHS '+bal.toLocaleString()]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="metric">${x[1]}</div></div>`).join('');
 document.getElementById('salesV3Body').innerHTML=sales.map(x=>`<tr><td>${new Date(x.date).toLocaleDateString()}</td><td>${esc(x.plot)}</td><td>${esc(x.customer)}</td><td>${esc(x.type)}</td><td>GHS ${x.price.toLocaleString()}</td><td>GHS ${x.paid.toLocaleString()}</td><td>GHS ${x.balance.toLocaleString()}</td><td><span class="badge ${statusClass(rec(x.plot).status)}">${esc(rec(x.plot).status)}</span></td></tr>`).join('');
 const customers={};sales.forEach(x=>customers[x.customer+'|'+x.plot]=x);
 document.getElementById('customerBody').innerHTML=Object.values(customers).map(x=>`<tr><td>${esc(x.customer)}</td><td>${esc(x.plot)}</td><td>${esc(x.phone||'-')}</td><td>${esc(x.card||'-')}</td><td>${esc(rec(x.plot).status)}</td></tr>`).join('');

function renderFinanceV3(){
